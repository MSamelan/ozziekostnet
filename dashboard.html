<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard OZZIEKOST</title>
<style>
body{font-family:Segoe UI;background:#f0f4ff;padding:30px;text-align:center;}
.box{background:white;padding:30px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h1{color:#0d6efd;}
.btn{background:#dc3545;padding:10px 20px;border:none;border-radius:8px;text-decoration:none;color:white;font-weight:bold;}
</style>
</head>
<body>
<div class="box">
  <h1 id="judul">Dashboard Penghuni</h1>
<p style="text-align:center;">Kode Kamar: <span id="kodeKamar">-</span></p>
<p>Selamat datang di OZZIEKOST</p>
<p><b>Tagihan Bulan Ini:</b> <span id="tagihan">Rp 2.000.000</span></p>
  <p><b>Jatuh Tempo:</b> 25 Agustus 2026</p>
  <br>
  <button onclick="logout()" class="btn">Logout</button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const user = params.get('user');

  if(user) {
    document.getElementById('judul').innerText = 'Dashboard Penghuni ' + user;

    const jenisKelamin = user.charAt(2) === 'A' ? 'Putra' : 'Putri';
    const tipeKode = user.substring(3, 6);
    const unit = user.charAt(6);
    const noKamar = user.substring(7, 9);

    let tipe = '';
    let tagihan = '';

    if(tipeKode === 'STD') { tipe = 'Standard'; tagihan = 'Rp 2.000.000'; }
    else if(tipeKode === 'SUP') { tipe = 'Superior'; tagihan = 'Rp 2.500.000'; }
    else if(tipeKode === 'DLX') { tipe = 'Delux'; tagihan = 'Rp 3.500.000'; }

    document.getElementById('kodeKamar').innerHTML = `${user} - ${jenisKelamin} ${tipe} Unit ${unit} No ${noKamar}`;
    document.getElementById('tagihan').innerText = tagihan;

  } else {
    window.location.href = 'login.html';
  }

  function logout() {
    window.location.href = 'login.html';
  }
</script>
</body>
</html>
