<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard OZZIEKOST</title>
<style>
body{font-family:Segoe UI;background:#f0f4ff;padding:30px;text-align:center;}
.box{background:white;padding:30px;border-radius:15px;max-width:400px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h1{color:#0d6efd;}
.btn{background:#dc3545;padding:10px 20px;border:none;border-radius:8px;text-decoration:none;color:white;font-weight:bold;}
</style>
</head>
<body>
<div class="box">
  <h1 id="judul">Dashboard Penghuni</h1>
  <p>Selamat datang di OZZIEKOST!</p>
  <p><b>Tagihan Bulan Ini:</b> Rp 2.000.000</p>
  <p><b>Jatuh Tempo:</b> 25 Agustus 2026</p>
  <br>
  <a href="login.html" class="btn">Logout</a>
</div>

<script>
  // Ambil nama user dari URL ?user=A01
  const params = new URLSearchParams(window.location.search);
  const user = params.get('user');
  
  if(user) {
    document.getElementById('judul').innerText = 'Dashboard Penghuni ' + user;
  }
</script>
</body>
</html>
