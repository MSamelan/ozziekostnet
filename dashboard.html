<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - OZZIEKOST</title>
<style>
:root{--gold:#D4AF37;--black:#0a0a0a;--gray:#1e1e1e}
body{margin:0;font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:white}
.header{background:#141414;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.header b{color:var(--gold)} button.logout{background:#333;color:white;border:1px solid #444;padding:8px 16px;border-radius:6px;cursor:pointer}
.tabs{display:flex;gap:10px;padding:20px 25px;background:#111;overflow-x:auto}
.tab{padding:10px 18px;background:var(--gray);border-radius:8px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.tab.active{background:var(--gold);color:black;font-weight:bold}
.content{padding:25px}.card{background:#141414;padding:20px;border-radius:12px;border:1px solid #2a2a2a;margin-bottom:20px}
input,select,textarea{width:100%;padding:12px;margin:8px 0;background:#0a0a0a;border:1px solid #333;border-radius:6px;color:white;box-sizing:border-box}
.btn-gold{background:var(--gold);color:black;padding:10px 18px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid #2a2a2a;text-align:left;font-size:13px} th{color:var(--gold)}
.badge{padding:3px 8px;border-radius:12px;font-size:11px}.pending{background:#332a00;color:#ffcc00}.approved{background:#00331a;color:#00ff88}.executed{background:#001a33;color:#00aaff}
</style>
</head>
<body>
<div class="header"><div>Welcome <b id="userLabel"></b> | Role: <b id="roleLabel"></b> <span id="roomLabel"></span></div><button class="logout" onclick="doLogout()">LOGOUT</button></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>
// AUTH CHECK
const sess = JSON.parse(localStorage.getItem("ozzie_session")||"null");
if(!sess){ window.location.href="index.html"; }
document.getElementById('userLabel').innerText=sess.user;
document.getElementById('roleLabel').innerText=sess.role.toUpperCase();
if(sess.room) document.getElementById('roomLabel').innerText="| Room "+sess.room;

// DATA STORE (later move to Firebase/D1)
let requests = JSON.parse(localStorage.getItem("ozzie_requests")||"[]");
function saveReq(){ localStorage.setItem("ozzie_requests", JSON.stringify(requests)); }

const TABS_BY_ROLE = {
  manager: ["Users & Accounts","Approvals","Finance","Maintenance Worksheet","All Forms"],
  admin: ["Input Resident","Input Payment","Pending Requests"],
  maintenance: ["Maintenance Worksheet"],
  resident: ["My Profile","Upload Receipt","Request Maintenance"]
};

function renderTabs(){
  const tabs = TABS_BY_ROLE[sess.role]||[];
  document.getElementById('tabs').innerHTML = tabs.map((t,i)=>`<div class="tab ${i==0?'active':''}" onclick="openTab('${t}',this)">${t}</div>`).join("");
  openTab(tabs[0]);
}
function openTab(name, el){
  if(el){ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); el.classList.add('active'); }
  const c = document.getElementById('content');

  if(name=="Users & Accounts" && sess.role=="manager"){
    c.innerHTML=`<div class="card"><h3 style="color:#D4AF37">Create New User</h3>
    <input id="newUser" placeholder="Username (e.g. A03)"><select id="newRole"><option value="resident">Resident</option><option value="admin">Admin</option><option value="maintenance">Maintenance</option></select>
    <input id="newPass" placeholder="Password"><button class="btn-gold" onclick="alert('For demo, add in ACCOUNTS object in index.html. Later this will insert to DB')">Create User (Manager Only)</button></div>`;
  }
  else if(name=="All Forms" || name=="Pending Requests"){
    c.innerHTML=`<div class="card"><h3 style="color:#D4AF37">Integrated Worksheet</h3><table><tr><th>ID</th><th>Room</th><th>Type</th><th>Status</th><th>Action</th></tr>${requests.map((r,i)=>`<tr><td>${r.id}</td><td>${r.room}</td><td>${r.type}</td><td><span class="badge ${r.status}">${r.status}</span></td><td>${sess.role=='manager'?`<button class="btn-gold" onclick="updateStatus(${i},'executed')">Execute</button>`: sess.role=='admin'?`<button class="btn-gold" onclick="updateStatus(${i},'approved')">Approve</button>`:'-'}</td></tr>`).join("")||'<tr><td colspan=5>No data yet</td></tr>'}</table></div>`;
  }
  else if(name=="Maintenance Worksheet"){
    const filtered = sess.role=='maintenance'? requests.filter(r=>r.type=='maintenance'):requests;
    c.innerHTML=`<div class="card"><h3 style="color:#D4AF37">Maintenance Worksheet</h3><table><tr><th>Room</th><th>Issue</th><th>Status</th><th>Follow-up</th></tr>${filtered.map((r,i)=>`<tr><td>${r.room}</td><td>${r.desc||'-'}</td><td><span class="badge ${r.status}">${r.status}</span></td><td>${sess.role=='maintenance'?`<button class="btn-gold" onclick="updateStatus(${i},'executed')">Mark Done</button>`:r.follow||'-'}</td></tr>`).join("")||'<tr><td colspan=4>No maintenance</td></tr>'}</table></div>`;
  }
  else if(name=="Upload Receipt" || name=="Input Payment"){
    c.innerHTML=`<div class="card"><h3 style="color:#D4AF37">Upload Transfer Receipt</h3><input type="file" id="receipt"><input id="amount" placeholder="Amount e.g. 2500000"><button class="btn-gold" onclick="addRequest('payment')">Submit Receipt</button></div>`;
  }
  else if(name=="Request Maintenance" || name=="Input Resident"){
    c.innerHTML=`<div class="card"><h3 style="color:#D4AF37">${name}</h3><textarea id="desc" placeholder="Describe issue / resident data"></textarea><button class="btn-gold" onclick="addRequest('${sess.role=='resident'?'maintenance':'form'}')">Submit</button></div>`;
  }
  else{
    c.innerHTML=`<div class="card"><h3 style="color:#D4AF37">${name}</h3><p>Form for ${sess.role}. Integrated to main worksheet.</p><textarea id="desc" placeholder="Input data"></textarea><button class="btn-gold" onclick="addRequest('form')">Save</button></div>`;
  }
}
function addRequest(type){
  const desc = document.getElementById('desc')?.value || document.getElementById('amount')?.value || "receipt uploaded";
  requests.push({id:"REQ"+Date.now(), room:sess.room||sess.user, type, desc, status:"pending"});
  saveReq(); alert("Submitted! Status: pending -> waiting for "+(sess.role=="resident"?"Admin approval":"Manager execution")); renderTabs();
}
function updateStatus(i, newStatus){ requests[i].status=newStatus; requests[i].follow="Updated by "+sess.role; saveReq(); renderTabs(); }
function doLogout(){ localStorage.removeItem("ozzie_session"); window.location.href="index.html"; }
renderTabs();
</script>
</body>
</html>
