<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin OZZIEKOST</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; margin: 0; padding: 20px; }
    .header { background: #007bff; color: white; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .container { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; }
    button { padding: 10px 15px; background: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Dashboard Admin OZZIEKOST</h2>
    <div>
      <span id="userInfo"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <h3>Selamat Datang di Panel Admin</h3>
    <p>Disini nanti isi data kost, penghuni, pembayaran, dll</p>
  </div>

<script>
  // CEK LOGIN
  const role = localStorage.getItem('userLogin');
  const username = localStorage.getItem('usernameLogin');

  if(role !== 'admin'){
    alert("Akses ditolak! Silahkan login sebagai Admin dulu");
    window.location.href = "index.html";
  } else {
    document.getElementById('userInfo').innerText = "Halo, " + username;
  }

  function logout(){
    localStorage.removeItem('userLogin');
    localStorage.removeItem('usernameLogin');
    alert("Logout Berhasil");
    window.location.href = "index.html";
  }
</script>
</body>
</html>
