<!DOCTYPE html>
<html>
<head>
  <title>Admin OZZIEKOST</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    h1 { color: #007bff; text-align: center; }
    input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #007bff; color: white; }
    .lunas { color: green; font-weight: bold; }
    .belum { color: red; font-weight: bold; }
    .logout { float: right; background: red; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
 <div class="container">
       <button class="logout" onclick="logout()">Logout</button>
    <h1>Dashboard Admin OZZIEKOST</h1>

    <div style="display: flex; gap: 15px; margin: 20px 0;">
        <div style="flex:1; background:#e7f3ff; padding:15px; border-radius:10px;"><h4>Pemasukan Bulan Ini</h4><h2 id="pemasukanBulan">Rp 0</h2></div>
        <div style="flex:1; background:#e8ffe7; padding:15px; border-radius:10px;"><h4>Total Pemasukan YTD</h4><h2 id="pemasukanTahun">Rp 0</h2></div>
        <div style="flex:1; background:#fff3e7; padding:15px; border-radius:10px;"><h4>Jatuh Tempo</h4><h2 id="jatuhTempo">25 Agustus 2026</h2></div>
    </div>
    
    <input type="text" id="search" placeholder="Cari Username..." onkeyup="filterTable()">
    <select id="filterUnit" onchange="filterTable()"><option value="all">Semua Unit</option></select>
    <span id="total"></span>

    <table><thead><tr><th>No</th><th>Username</th><th>Unit</th><th>Tipe</th><th>Harga</th><th>Next Due</th><th>Status</th></tr></thead><tbody id="bodyTabel"></tbody></table>
  </div>
  
<script>
// Cek login HANYA untuk halaman admin
if(window.location.pathname.includes("admin.html") && !localStorage.getItem('userLogin')){
    window.location.href = "login.html";
}  

// HARGA UDAH DISERAGAMKAN SAMA HOMEPAGE
const dataPenghuni = [
  {user: "BUDI01", unit: 1, tipe: "Standard", harga: 2000000},
  {user: "SITI02", unit: 2, tipe: "Superior", harga: 2500000},
  {user: "AGUS03", unit: 3, tipe: "Delux", harga: 3500000},
  {user: "DEWI04", unit: 4, tipe: "Standard", harga: 2000000},
  {user: "RONI05", unit: 5, tipe: "Superior", harga: 2500000},
];

function cekStatusBayar(user) { return Math.random() > 0.4; }

function hitungKeuangan(data) {
    let pemasukanBulan = 0;
    data.forEach(p => { if(p.lunas){ pemasukanBulan += p.harga; }});
    document.getElementById('pemasukanBulan').innerText = 'Rp ' + pemasukanBulan.toLocaleString('id-ID');
}
  
function tampilkanTabel(dataAsli) {
  // GENERATE STATUS 1X DI AWAL BIAR SAMA
  const dataDenganStatus = dataAsli.map(p => {
      return {...p, lunas: cekStatusBayar(p.user)}
  });

  const tbody = document.getElementById('bodyTabel'); tbody.innerHTML = '';
  dataDenganStatus.forEach((p, i) => {
    tbody.innerHTML += `<tr><td>${i+1}</td><td>${p.user}</td><td>Unit ${p.unit}</td><td>${p.tipe}</td><td>Rp ${p.harga.toLocaleString('id-ID')}</td><td>25 Agustus</td><td class="${p.lunas?'lunas':'belum'}">${p.lunas?'Lunas':'Belum'}</td></tr>`;
  });
  document.getElementById('total').innerText = `Total: ${dataDenganStatus.length} Penghuni`;
  
  hitungKeuangan(dataDenganStatus); // HITUNG PAKE DATA YG SAMA
}
  
function filterTable() {
  const search = document.getElementById('search').value.toUpperCase();
  const hasilFilter = dataPenghuni.filter(p => p.user.includes(search));
  tampilkanTabel(hasilFilter);  
}

// PANGGIL 1X AJA
tampilkanTabel(dataPenghuni); 

function logout(){
    localStorage.removeItem('userLogin');
    alert("Logout Berhasil!");
    window.location.href = "index.html";  // KE HOME
}
</script>
</body>
</html>
