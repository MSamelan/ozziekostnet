<!DOCTYPE html>
<html>
<head>
  <title>Admin OZZIEKOST</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    h1 { color: #007bff; text-align: center; }
    input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #007bff; color: white; }
    .lunas { color: green; font-weight: bold; }
    .belum { color: red; font-weight: bold; }
    .logout { float: right; background: red; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
 <div class="container">
    <button class="logout" onclick="logout()">Logout</button>
    <h1>Dashboard Admin OZZIEKOST</h1>

    <!-- BOX RINGKASAN KEUANGAN -->
    <div style="display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap;">
        <div style="flex:1; background:#e7f3ff; padding:15px; border-radius:10px; border-left:5px solid #007bff;">
            <h4>Pemasukan Bulan Ini</h4>
            <h2 id="pemasukanBulan">Rp 0</h2>
        </div>
        <div style="flex:1; background:#e8ffe7; padding:15px; border-radius:10px; border-left:5px solid #28a745;">
            <h4>Total Pemasukan YTD 2026</h4>
            <h2 id="pemasukanTahun">Rp 0</h2>
        </div>
        <div style="flex:1; background:#fff3e7; padding:15px; border-radius:10px; border-left:5px solid #fd7e14;">
            <h4>Tagihan Jatuh Tempo</h4>
            <h2 id="jatuhTempo">25 Agustus 2026</h2>
        </div>
    </div>
    
    <input type="text" id="search" placeholder="Cari Username..." onkeyup="filterTable()">
    <select id="filterUnit" onchange="filterTable()">
      <option value="all">Semua Unit</option>
      <option value="1">Unit 1 - Putra</option>
      <option value="2">Unit 2 - Putri</option>
      <option value="3">Unit 3 - Putri</option>
    </select>
    <span id="total"></span>

    <table id="tabelPenghuni">
      <thead>
        <tr>
          <th>No</th>
          <th>Username</th>
          <th>Unit</th>
          <th>Tipe Kamar</th>
   <th>Harga</th>
<th>Next Due Date</th>
<th>Status Bayar</th>
        </tr>
      </thead>
      <tbody id="bodyTabel"></tbody>
    </table>
  </div>
  
    <script>
    // Data sewa: tiap tgl 25 jatuh tempo
    const TANGGAL_JATUH_TEMPO = 25; 

    const dataPenghuni = [
      // ... BIARKAN DATA 60 PENGHUNI KAMU YG LAMA DI SINI JANGAN DIHAPUS ...
    ];

    function cekStatusBayar(user) {
        // Sementara random. Nanti ganti ambil dari localStorage
        return Math.random() > 0.4; 
    }

    function hitungKeuangan() {
        let pemasukanBulan = 0;
        let pemasukanTahun = 0;
        const bulanSekarang = new Date().getMonth() + 1; // 1-12
        
        dataPenghuni.forEach(p => {
            if(cekStatusBayar(p.user)){
                pemasukanBulan += p.harga;
                pemasukanTahun += p.harga * bulanSekarang; // YTD = harga x jumlah bulan
            }
        });

        document.getElementById('pemasukanBulan').innerText = 'Rp ' + pemasukanBulan.toLocaleString('id-ID');
        document.getElementById('pemasukanTahun').innerText = 'Rp ' + pemasukanTahun.toLocaleString('id-ID');
    }
  
    function tampilkanTabel(data) {
      const tbody = document.getElementById('bodyTabel');
      tbody.innerHTML = '';
      data.forEach((p, i) => {
        const lunas = cekStatusBayar(p.user);
        const status = lunas ? 'Lunas' : 'Belum Bayar';
        const bulanIni = new Date().toLocaleString('id-ID', {month: 'long'});
        const nextDue = `25 ${bulanIni} 2026`; 
        const classStatus = lunas ? 'lunas' : 'belum';
        tbody.innerHTML += `
          <tr>
            <td>${i+1}</td>
            <td>${p.user}</td>
            <td>Unit ${p.unit}</td>
            <td>${p.tipe}</td>
            <td>Rp ${p.harga.toLocaleString('id-ID')}</td>
            <td>${nextDue}</td>
            <td class="${classStatus}">${status}</td>
          </tr>
        `;
      });
      document.getElementById('total').innerText = `Total: ${data.length} Penghuni`;
    }
  
    function filterTable() {
      const search = document.getElementById('search').value.toUpperCase();
      const unit = document.getElementById('filterUnit').value;
      let filtered = dataPenghuni;
      
      if(unit !== 'all') filtered = filtered.filter(p => p.unit == unit);
      if(search) filtered = filtered.filter(p => p.user.includes(search));
      
      tampilkanTabel(filtered);
    }
    hitungKeuangan();
    tampilkanTabel(dataPenghuni);
  
  function logout(){
    localStorage.removeItem('userLogin'); // hapus sesi login
    alert("Logout Berhasil!");
    window.location.href = "login.html"; // balik ke login
}
    </script>
</body>
</html>
