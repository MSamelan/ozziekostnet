<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login OZZIEKOST + MFA</title>
  <style>
    body { font-family: Arial; background: #007bff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 40px; border-radius: 15px; width: 400px; text-align: center; }
    .login-box input, .login-box select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .step { display: none; }
    .step.active { display: block; }
    .hint { font-size: 12px; color: #666; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login OZZIEKOST</h2>
    
    <!-- STEP 1: USERNAME PASSWORD -->
    <div id="step1" class="step active">
      <select id="role">
        <option value="">Login Sebagai...</option>
        <option value="admin">Admin</option>
        <option value="resident">Resident</option>
      </select>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="loginStep1()">Login</button>
      <p class="hint">Belum punya PIN? Daftar dulu di bawah</p>
      <button onclick="showRegister()" style="background:#28a745; margin-top:5px;">Daftar Akun Baru</button>
    </div>

    <!-- STEP 2: OTP + PIN -->
    <div id="step2" class="step">
      <p>1. Cek Alert untuk kode OTP <br> 2. Masukkan OTP + PIN 6 angka kamu</p>
      <input type="text" id="otpInput" placeholder="Masukkan 6 digit OTP dari Alert" maxlength="6">
      <input type="password" id="pinInput" placeholder="Masukkan PIN 6 angka kamu" maxlength="6">
      <button onclick="verifikasiMFA()">Verifikasi & Masuk</button>
    </div>

    <!-- STEP DAFTAR -->
    <div id="stepDaftar" class="step">
      <h3>Daftar Akun + Set PIN</h3>
      <select id="regRole">
        <option value="resident">Resident</option>
        <option value="admin">Admin</option>
      </select>
      <input type="text" id="regUser" placeholder="Buat Username">
      <input type="password" id="regPass" placeholder="Buat Password">
      <input type="password" id="regPin" placeholder="Buat PIN 6 Angka" maxlength="6">
      <button onclick="daftarAkun()">Simpan Akun</button>
      <button onclick="backToLogin()" style="background:#6c757d; margin-top:5px;">Kembali</button>
    </div>
  </div>

<script>
let kodeOTP = ""; 
let userLoginSaatIni = "";

// DATA DUMMY ADMIN. NANTI BISA DIHAPUS KALAU UDAH DAFTAR
const defaultAdmin = {user: "Admin", pass: "Test-test123", pin: "123456"};

function loginStep1(){
    const role = document.getElementById('role').value;
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;

    // AMBIL DATA DARI LOCALSTORAGE
    let users = JSON.parse(localStorage.getItem('ozzieUsers')) || [];
    users.push(defaultAdmin); // tambahin admin default

    const foundUser = users.find(u => u.user === user && u.pass === pass && u.role === role);

    if(!foundUser){
        alert("Username/Password/Role Salah!");
        return;
    }

    // 1. GENERATE OTP 6 DIGIT RANDOM
    kodeOTP = Math.floor(100000 + Math.random() * 900000);
    alert("KODE OTP KAMU: " + kodeOTP + "\n\nJangan kasih ke siapapun!");

    userLoginSaatIni = foundUser; // simpan data user yg login
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
}

function verifikasiMFA(){
    const otpInput = document.getElementById('otpInput').value;
    const pinInput = document.getElementById('pinInput').value;

    // 2. CEK OTP DARI ALERT + PIN PRIBADI
    if(otpInput === kodeOTP.toString() && pinInput === userLoginSaatIni.pin){
        localStorage.setItem('userLogin', userLoginSaatIni.role); // simpan role
        localStorage.setItem('usernameLogin', userLoginSaatIni.user); // simpan username
        alert("Login Berhasil!");
        
        if(userLoginSaatIni.role === "admin"){
            window.location.href = "admin.html";
        } else {
            window.location.href = "index.html"; 
        }
    } else {
        alert("OTP atau PIN Salah!");
    }
}

// FUNGSI DAFTAR
function showRegister(){
    document.getElementById('step1').classList.remove('active');
    document.getElementById('stepDaftar').classList.add('active');
}
function backToLogin(){
    document.getElementById('stepDaftar').classList.remove('active');
    document.getElementById('step1').classList.add('active');
}
function daftarAkun(){
    const role = document.getElementById('regRole').value;
    const user = document.getElementById('regUser').value;
    const pass = document.getElementById('regPass').value;
    const pin = document.getElementById('regPin').value;

    if(pin.length !== 6 || isNaN(pin)){
        alert("PIN harus 6 angka!");
        return;
    }

    let users = JSON.parse(localStorage.getItem('ozzieUsers')) || [];
    users.push({role, user, pass, pin});
    localStorage.setItem('ozzieUsers', JSON.stringify(users));
    alert("Akun Berhasil Dibuat! Silahkan Login");
    backToLogin();
}
</script>
</body>
</html>
