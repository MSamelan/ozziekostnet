<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Penghuni - OZZIEKOST</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:linear-gradient(135deg, #0d6efd, #0056b3); height:100vh; display:flex; justify-content:center; align-items:center; margin:0; }
    .login-box { background:white; padding:40px; border-radius:15px; width:90%; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.2); text-align:center; }
    .login-box h2 { color:#0d6efd; margin-bottom:10px; }
    .login-box p { color:#666; margin-bottom:30px; }
    input { width:100%; padding:14px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
    button { background:#ffc107; color:#000; padding:14px; border:none; border-radius:8px; width:100%; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px; }
    button:hover { background:#e0a800; }
    .back { margin-top:20px; font-size:14px; }
    .back a { color:#0d6efd; text-decoration:none; }
    .notice { background:#fff3cd; padding:10px; border-radius:8px; font-size:13px; margin-top:20px; color:#856404; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>Login Ozziekost Residen</h2>
  <p>Khusus OZZIEKOST Residen yang sudah ACC</p>
  
  <form onsubmit="return loginDummy()">
    <input type="text" id="username" placeholder="Username / No Kamar" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Masuk</button>
  </form>

  <div class="notice">
    ⚠️ Lupa password? Chat Admin via WhatsApp: +628xxx xxx xxx
  </div>

  <div class="back">
    <a href="index.html">← Kembali ke Home</a>
  </div>
</div>

<script>
function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const error = document.getElementById('error');

  const users = {
    "OKPA101": "123456",
    "OKPA102": "123456", 
    "OKPA103": "123456"
  };

  if(users[username] && users[username] === password) {
    window.location.href = 'dashboard.html?user=' + username;
  } else {
    error.style.display = 'block';
  }
}
</script>
</body>
</html>
