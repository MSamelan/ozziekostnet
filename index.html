<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login OZZIEKOST</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script> <style>
    body { font-family: Arial; background: #007bff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.login-box { background: white; padding: 35px; border-radius: 15px; width: 420px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
.login-box h2 { color: #007bff; margin-bottom: 20px; }
.login-box input,.login-box select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
.login-box button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 16px; }
.login-box button:hover { opacity: 0.9; }
.step { display: none; }
.step.active { display: block; }
.hint { font-size: 12px; color: #666; margin-top: 10px; }
.link { color: #007bff; cursor: pointer; text-decoration: underline; font-size: 14px; }
.btn-green { background: #28a745; }
.btn-gray { background: #6c757d; }
.password-wrapper { position: relative; }
.toggle-pass { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; }
.error { color: red; font-size: 12px; text-align: left; margin-top: -5px; margin-bottom: 5px; }
.info-box { background: #e7f3ff; padding: 10px; border-radius: 5px; font-size: 12px; color: #004085; margin: 10px 0; text-align: left; }
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
.modal-content { background: white; padding: 25px; border-radius: 10px; width: 400px; text-align: left; }
.modal-content h3 { text-align: center; color: #007bff; margin-top: 0; }
.cf-turnstile { margin: 15px 0; display: flex; justify-content: center; } /* TAMBAHAN BUAT TAMPILAN TURNSTILE */
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login OZZIEKOST</h2>

    <!-- STEP 1: LOGIN -->
    <div id="step1" class="step active">
      <form id="formLogin" autocomplete="off">
        <input type="text" id="username" placeholder="Email Address or Username">
        <div class="password-wrapper"><input type="password" id="password" placeholder="Password"><span class="toggle-pass" onclick="togglePassword('password')">👁️</span></div>
        
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEWi7VyX_qtLolIN"></div> <button type="button" onclick="loginStep1()">Login</button>
      </form>
      <p class="hint"><span class="link" onclick="showPendaftaran()">Daftar Jadi Calon Resident</span> | <span class="link" onclick="showForgot()">Lupa Password/PIN?</span></p>
    </div>
    
   ... kode kamu yang lain tetap sama sampai akhir...
    
<script>
let kodeOTP = "";
let userLoginSaatIni = "";
let dataTempDaftar = {}; 
const TEMP_PASS = "Salam@123456";
const TEMP_PIN = "654321";

function getAllUsers(){ let users = JSON.parse(localStorage.getItem('ozzieUsers')) || []; if(!users.find(u => u.user === "Admin")){ users.push({role: "admin", user: "Admin", email: "admin@ozziekost.com", pass: "Test-test1234@", dob: "01-01-1990", pin: "123456", room: "", status: "active"}); } if(!users.find(u => u.user === "Budi")){ users.push({role: "resident", user: "Budi", email: "budi@anakkost.com", pass: TEMP_PASS, dob: "01-01-1990", pin: TEMP_PIN, room: "OZA1005", status: "pending"}); } return users; }
function saveUsers(users){ localStorage.setItem('ozzieUsers', JSON.stringify(users)); }
function togglePassword(id){ const input = document.getElementById(id); input.type = input.type === "password"? "text" : "password"; }
function validasiTanggal(tgl){ return /^(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[012])-(19|20)\d\d$/.test(tgl); }
function resetForm(formId){ document.getElementById(formId).reset(); turnstile.reset(); } // RESET TURNSTILE JUGA

async function loginStep1(){
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const turnstileToken = document.querySelector('[name=cf-turnstile-response]').value; // AMBIL TOKEN TURNSTILE

    if(!user ||!pass){ alert("Semua field wajib diisi!"); return; }
    if(!turnstileToken){ alert("Harap verifikasi bahwa kamu manusia!"); return; } // CEK TURNSTILE

    // KIRIM KE WORKER BUAT VALIDASI
    const response = await fetch('https://ozzie-login-worker.ozziekost.workers.dev', { // GANTI URL INI NANTI
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: user, password: pass, token: turnstileToken})
    });
    const result = await response.json();

    if(!result.success){ alert(result.message); resetForm('formLogin'); return; }

    kodeOTP = Math.floor(100000 + Math.random() * 900000);
    alert("KODE OTP KAMU: " + kodeOTP);
    userLoginSaatIni = result.user;
    resetForm('formLogin');
    hideAll();
    document.getElementById('step2').classList.add('active');
}

//... sisa fungsi kamu yang lain tetap sama...
function verifikasiMFA(){... }
function daftarCalon(){... resetForm('formCalon'); backToLogin(); }
function backToLogin(){ hideAll(); resetForm('formLogin'); resetForm('formOTP'); resetForm('formLupa'); resetForm('formCalon'); document.getElementById('step1').classList.add('active'); }
function hideAll(){ document.querySelectorAll('.step').forEach(s => s.classList.remove('active')); }
</script>
</body>
</html>
