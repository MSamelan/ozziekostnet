<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZZIEKOST</title>
<style>
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Segoe UI',sans-serif;
  background: #7AC74F; /* BASE - your palm leaf colour */
}
.box{
  background:#141414;padding:36px 28px;border-radius:18px;
  border:1px solid #2a2a2a;width:90%;max-width:380px;
  box-shadow:0 15px 50px rgba(0,0,0,0.4)
}
h1{color:#D4AF37;text-align:center;letter-spacing:3px;margin:0 0 6px;font-size:32px}
.sub{color:#888;text-align:center;font-size:13px;margin-bottom:24px}
input{width:100%;padding:14px;background:#0a0a0a;border:1px solid #333;border-radius:10px;color:white;box-sizing:border-box;margin:8px 0 12px}
input:focus{border-color:#D4AF37;outline:none}
.btn{width:100%;padding:14px;background:#D4AF37;color:black;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px}
.btn:hover{background:#F5E6A3}
.err{color:#ff6666;font-size:12px;text-align:center;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="box">
<h1>OZZIEKOST</h1>
<div class="sub">Secure Integrated System</div>
<input id="user" placeholder="Username / Room No">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">LOGIN</button>
<div id="err" class="err">Invalid login</div>
</div>

<script>
// 🔴🔴🔴 EDITABLE PASSWORDS - ONLY YOU CAN CHANGE HERE 🔴🔴🔴
const SECURE_CONFIG = {
  manager: "manager@321",
  admin: "admin@321",
  maintenance: "maint@321",
  resident_default: "resident@321"
};
// END EDITABLE

const ACCOUNTS = {
  "manager": {pass: SECURE_CONFIG.manager, role:"manager"},
  "admin": {pass: SECURE_CONFIG.admin, role:"admin"},
  "maintenance": {pass: SECURE_CONFIG.maintenance, role:"maintenance"},
  "A01": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A01"},
  "A02": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A02"},
  "A03": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A03"},
  "A04": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A04"},
  "A05": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A05"}
};

function login(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  const acc=ACCOUNTS[u];
  if(acc && acc.pass===p){
    localStorage.setItem("ozzie_session", JSON.stringify({user:u, role:acc.role, room:acc.room||""}));
    location.href="dashboard.html";
  } else {
    document.getElementById('err').style.display='block';
  }
}
document.addEventListener('keypress', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
