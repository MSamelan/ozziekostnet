<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZZIEKOST - Secure Login</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root{--gold:#D4AF37;--gold-light:#F5E6A3;--black:#0A0A0A;--gray:#1a1a1a}
body{margin:0;font-family:'Segoe UI',sans-serif;background:radial-gradient(circle at top,var(--gray),var(--black));min-height:100vh;display:flex;justify-content:center;align-items:center;color:white}
.login-box{background:#141414;border:1px solid #2a2a2a;padding:40px;border-radius:16px;width:90%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
h2{color:var(--gold);text-align:center;margin:0 0 5px;letter-spacing:2px}
.sub{color:#888;text-align:center;font-size:13px;margin-bottom:25px}
input{width:100%;padding:14px;background:#0a0a0a;border:1px solid #333;border-radius:8px;color:white;box-sizing:border-box;margin:10px 0}
input:focus{border-color:var(--gold);outline:none}
button{background:var(--gold);color:black;padding:14px;width:100%;border:none;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:15px}
button:hover{background:var(--gold-light)}
.role-hint{font-size:11px;color:#666;margin-top:15px;background:#0a0a0a;padding:10px;border-radius:6px}
</style>
</head>
<body>
<div class="login-box">
  <h2>OZZIEKOST</h2>
  <div class="sub">Secure Integrated System</div>
  <input type="text" id="username" placeholder="Username / Room No" required>
  <input type="password" id="password" placeholder="Password" required>
  <div style="margin:15px 0;display:flex;justify-content:center">
   <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark"></div>
  <button onclick="doLogin()">LOGIN</button>
  <div class="role-hint">
    TEST ACCOUNTS:<br>
    manager / manager@321<br>
    admin / admin@321<br>
    maintenance / maint@321<br>
    A01 / resident@321
  </div>
</div>

<script>
// SECURE ACCOUNTS - for production move to Cloudflare D1 / Firebase
const ACCOUNTS = {
  "manager": {pass:"manager@321", role:"manager"},
  "admin": {pass:"admin@321", role:"admin"},
  "maintenance": {pass:"maint@321", role:"maintenance"},
  "A01": {pass:"resident@321", role:"resident", room:"A01"},
  "A02": {pass:"resident@321", role:"resident", room:"A02"}
};

function doLogin(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

  if(!turnstileToken){ alert("Please complete security check"); return; }
  if(!ACCOUNTS[u]){ alert("User not found"); return; }
  if(ACCOUNTS[u].pass!== p){ alert("Wrong password"); return; }

  // Create secure session
  const session = {user:u, role:ACCOUNTS[u].role, room:ACCOUNTS[u].room||"", loginTime:Date.now(), token:turnstileToken.slice(0,20)};
  localStorage.setItem("ozzie_session", JSON.stringify(session));
  window.location.href="dashboard.html";
}
</script>
</body>
</html>
