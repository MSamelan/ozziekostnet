<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login OZZIEKOST + MFA + PIN Recovery</title>
  <style>
    body { font-family: Arial; background: #007bff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; }
.login-box { background: white; padding: 35px; border-radius: 15px; width: 400px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
.login-box h2 { color: #007bff; margin-bottom: 20px; }
.login-box input,.login-box select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
.login-box button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 16px; }
.login-box button:hover { opacity: 0.9; }
.step { display: none; }
.step.active { display: block; }
.hint { font-size: 12px; color: #666; margin-top: 10px; }
.link { color: #007bff; cursor: pointer; text-decoration: underline; font-size: 14px; }
.btn-green { background: #28a745; }
.btn-gray { background: #6c757d; }
.btn-red { background: #dc3545; margin-top: 15px; }
.password-wrapper { position: relative; }
.toggle-pass { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; user-select: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login OZZIEKOST</h2>

    <!-- STEP 1: LOGIN -->
    <div id="step1" class="step active">
      <select id="role">
        <option value="">Login Sebagai...</option>
        <option value="admin">Admin</option>
        <option value="resident">Resident</option>
      </select>
      <input type="text" id="username" placeholder="Username">
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password">
        <span class="toggle-pass" onclick="togglePassword('password')">👁️</span>
      </div>
      <button onclick="loginStep1()">Login</button>
      <p class="hint"><span class="link" onclick="showRegister()">Daftar Akun Baru</span> | <span class="link" onclick="showForgotPin()">Lupa PIN?</span></p>
      <button class="btn-red" onclick="resetData()">Reset Semua Data</button>
    </div>

    <!-- STEP 2: OTP + PIN -->
    <div id="step2" class="step">
      <p><b>Verifikasi 2 Langkah</b><br>1. Cek Alert untuk kode OTP <br> 2. Masukkan OTP + PIN 6 angka kamu</p>
      <input type="text" id="otpInput" placeholder="Masukkan 6 digit OTP dari Alert" maxlength="6">
      <div class="password-wrapper">
        <input type="password" id="pinInput" placeholder="Masukkan PIN 6 angka kamu" maxlength="6">
        <span class="toggle-pass" onclick="togglePassword('pinInput')">👁️</span>
      </div>
      <button onclick="verifikasiMFA()">Verifikasi & Masuk</button>
      <p class="hint"><span class="link" onclick="backToLogin()">Kembali ke Login</span></p>
    </div>

    <!-- STEP 3: DAFTAR -->
    <div id="stepDaftar" class="step">
      <h3>Daftar Akun + Set PIN</h3>
      <select id="regRole">
        <option value="resident">Resident</option>
        <option value="admin">Admin</option>
      </select>
      <input type="text" id="regUser" placeholder="Buat Username">
      <div class="password-wrapper">
        <input type="password" id="regPass" placeholder="Buat Password">
        <span class="toggle-pass" onclick="togglePassword('regPass')">👁️</span>
      </div>
      <input type="text" id="regDob" placeholder="Tanggal Lahir: DD-MM-YYYY" maxlength="10">
      <div class="password-wrapper">
        <input type="password" id="regPin" placeholder="Buat PIN 6 Angka" maxlength="6">
        <span class="toggle-pass" onclick="togglePassword('regPin')">👁️</span>
      </div>
      <button class="btn-green" onclick="daftarAkun()">Simpan Akun</button>
      <button class="btn-gray" onclick="backToLogin()">Kembali</button>
    </div>

    <!-- STEP 4: LUPA PIN -->
    <div id="stepLupaPin" class="step">
      <h3>Reset PIN</h3>
      <p>Masukkan data untuk verifikasi</p>
      <select id="forgotRole">
        <option value="resident">Resident</option>
        <option value="admin">Admin</option>
      </select>
      <input type="text" id="forgotUser" placeholder="Username">
      <div class="password-wrapper">
        <input type="password" id="forgotPass" placeholder="Password Lama">
        <span class="toggle-pass" onclick="togglePassword('forgotPass')">👁️</span>
      </div>
      <input type="text" id="forgotDob" placeholder="Tanggal Lahir: DD-MM-YYYY" maxlength="10">
      <div class="password-wrapper">
        <input type="password" id="newPin" placeholder="Buat PIN 6 Angka Baru" maxlength="6">
        <span class="toggle-pass" onclick="togglePassword('newPin')">👁️</span>
      </div>
      <button class="btn-green" onclick="resetPin()">Reset PIN</button>
      <button class="btn-gray" onclick="backToLogin()">Kembali</button>
    </div>
  </div>

<script>
let kodeOTP = "";
let userLoginSaatIni = "";

// DATA DUMMY
const defaultAdmin = {role: "admin", user: "Admin", pass: "Test-test123", dob: "01-01-1990", pin: "123456"};
const defaultResident = {role: "resident", user: "Budi", pass: "123456", dob: "25-12-2000", pin: "654321"};

function getAllUsers(){
    let users = JSON.parse(localStorage.getItem('ozzieUsers')) || [];
    if(!users.find(u => u.user === "Admin")){ users.push(defaultAdmin); }
    if(!users.find(u => u.user === "Budi")){ users.push(defaultResident); }
    return users;
}

function saveUsers(users){ localStorage.setItem('ozzieUsers', JSON.stringify(users)); }

// TOMBOL RESET BARU
function resetData(){
    if(confirm("Yakin mau hapus semua data user?")){
        localStorage.clear();
        alert("Data berhasil direset! Refresh halaman.");
        location.reload();
    }
}

function togglePassword(id){ const input = document.getElementById(id); input.type = input.type === "password"? "text" : "password"; }
function validasiTanggal(tgl){ const regex = /^(0[1-9]|[12][0-9]|3[01])-(0[1-9]|1[012])-(19|20)\d\d$/; return regex.test(tgl); }

function loginStep1(){
    const role = document.getElementById('role').value;
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    if(!role ||!user ||!pass){ alert("Semua field wajib diisi!"); return; }
    const users = getAllUsers();
    const foundUser = users.find(u => u.user === user && u.pass === pass && u.role === role);
    if(!foundUser){ alert("Username/Password/Role Salah!"); return; }
    kodeOTP = Math.floor(100000 + Math.random() * 900000);
    alert("KODE OTP KAMU: " + kodeOTP + "\n\nJangan kasih ke siapapun!");
    userLoginSaatIni = foundUser;
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
}

function verifikasiMFA(){
    const otpInput = document.getElementById('otpInput').value;
    const pinInput = document.getElementById('pinInput').value;
    if(otpInput === kodeOTP.toString() && pinInput === userLoginSaatIni.pin){
        localStorage.setItem('userLogin', userLoginSaatIni.role);
        localStorage.setItem('usernameLogin', userLoginSaatIni.user);
        alert("Login Berhasil!");
        if(userLoginSaatIni.role === "admin"){ window.location.href = "admin.html"; } 
        else { alert("Login Resident Berhasil! Halaman resident belum dibuat."); }
    } else { alert("OTP atau PIN Salah!"); }
}

function showRegister(){ hideAll(); document.getElementById('stepDaftar').classList.add('active'); }
function showForgotPin(){ hideAll(); document.getElementById('stepLupaPin').classList.add('active'); }
function backToLogin(){ hideAll(); document.getElementById('step1').classList.add('active'); }
function hideAll(){ document.querySelectorAll('.step').forEach(s => s.classList.remove('active')); }

function daftarAkun(){
    const role = document.getElementById('regRole').value;
    const user = document.getElementById('regUser').value;
    const pass = document.getElementById('regPass').value;
    const dob = document.getElementById('regDob').value;
    const pin = document.getElementById('regPin').value;
    if(!user ||!pass ||!dob || pin.length!== 6 || isNaN(pin)){ alert("Semua field wajib diisi! PIN harus 6 angka"); return; }
    if(!validasiTanggal(dob)){ alert("Format Tanggal Lahir salah! Gunakan DD-MM-YYYY"); return; }
    let users = getAllUsers();
    if(users.find(u => u.user === user)){ alert("Username sudah terdaftar!"); return; }
    users.push({role, user, pass, dob, pin});
    saveUsers(users);
    alert("Akun Berhasil Dibuat! Silahkan Login");
    backToLogin();
}

function resetPin(){
    const role = document.getElementById('forgotRole').value;
    const user = document.getElementById('forgotUser').value;
    const pass = document.getElementById('forgotPass').value;
    const dob = document.getElementById('forgotDob').value;
    const newPin = document.getElementById('newPin').value;
    if(newPin.length!== 6 || isNaN(newPin)){ alert("PIN Baru harus 6 angka!"); return; }
    if(!validasiTanggal(dob)){ alert("Format Tanggal Lahir salah! Gunakan DD-MM-YYYY"); return; }
    let users = getAllUsers();
    const userIndex = users.findIndex(u => u.user === user && u.pass === pass && u.dob === dob && u.role === role);
    if(userIndex === -1){ alert("Data tidak cocok! Cek Username, Password, DOB, dan Role"); return; }
    users[userIndex].pin = newPin;
    saveUsers(users);
    alert("PIN Berhasil Direset! Silahkan Login dengan PIN baru");
    backToLogin();
}
</script>
</body>
</html>
