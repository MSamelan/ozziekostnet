<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZZIEKOST - Secure Login</title>
<style>
:root{--gold:#D4AF37;--black:#0A0A0A;--card:#141414;--border:#2a2a2a}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);font-family:'Segoe UI',sans-serif}
.box{background:var(--card);padding:36px 28px;border-radius:18px;border:1px solid var(--border);width:90%;max-width:380px}
h1{color:var(--gold);text-align:center;letter-spacing:3px;margin:0 0 6px}
.sub{color:#888;text-align:center;font-size:13px;margin-bottom:24px}
input{width:100%;padding:14px;background:#0a0a0a;border:1px solid #333;border-radius:10px;color:white;box-sizing:border-box;margin:8px 0 12px}
.btn{width:100%;padding:14px;background:var(--gold);color:black;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}
.err{color:#ff6666;font-size:12px;text-align:center;margin-top:10px;display:none}
</style>
<!-- Firebase SDK - For future Auth -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="box">
<h1>OZZIEKOST</h1>
<div class="sub">Secure Integrated System</div>
<input id="user" placeholder="Username / Room No" autocomplete="off">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">LOGIN</button>
<div id="err" class="err">Invalid login</div>
</div>

<script>
// ==========================================================
// 🔴🔴🔴 EDITABLE PASSWORDS - ONLY YOU CAN CHANGE HERE 🔴🔴🔴
// Change the values inside " " to change passwords
// This section is RED for you to find easily
// ==========================================================
const SECURE_CONFIG = {
  manager: "manager@321", // <-- CHANGE MANAGER PASSWORD HERE
  admin: "admin@321", // <-- CHANGE ADMIN PASSWORD HERE
  maintenance: "maint@321", // <-- CHANGE MAINTENANCE PASSWORD HERE
  resident_default: "resident@321" // <-- CHANGE ALL RESIDENT PASSWORD HERE
};
// ==========================================================
// END OF EDITABLE SECTION - DO NOT EDIT BELOW
// ==========================================================

// Firebase Config - Replace with your project later
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "ozziekost.firebaseapp.com",
  projectId: "ozziekost",
  appId: "YOUR_APP_ID"
};
// Initialize Firebase (will work once you add your keys)
try { firebase.initializeApp(firebaseConfig); } catch(e){ console.log("Firebase not yet configured, using local auth"); }

const ACCOUNTS = {
  "manager": {pass: SECURE_CONFIG.manager, role:"manager"},
  "admin": {pass: SECURE_CONFIG.admin, role:"admin"},
  "maintenance": {pass: SECURE_CONFIG.maintenance, role:"maintenance"},
  "A01": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A01"},
  "A02": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A02"},
  "A03": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A03"},
  "A04": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A04"},
  "A05": {pass: SECURE_CONFIG.resident_default, role:"resident", room:"A05"}
};

async function login(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();

  // 1. Try Firebase Auth first (if configured)
  try {
    if(firebase.apps.length && firebaseConfig.apiKey!== "YOUR_API_KEY"){
      await firebase.auth().signInWithEmailAndPassword(u+"@ozziekost.com", p);
      // If Firebase success, continue
    }
  } catch(e){ /* Firebase not configured, fallback to local */ }

  // 2. Local secure check (fallback)
  const acc=ACCOUNTS[u];
  if(acc && acc.pass===p){
    localStorage.setItem("ozzie_session", JSON.stringify({user:u, role:acc.role, room:acc.room||""}));
    location.href="dashboard.html";
  } else {
    document.getElementById('err').style.display='block';
  }
}
</script>
</body>
</html>
