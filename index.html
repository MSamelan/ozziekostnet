<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OZZIEKOST - Secure Integrated System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;border:6px solid #4ade80}
.card{background:#111;width:360px;padding:32px;border-radius:16px;text-align:center}
h1{color:#facc15;letter-spacing:3px;font-size:28px;font-weight:800}
.sub{color:#666;font-size:12px;letter-spacing:3px;margin:8px 0 24px}
input{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:14px 16px;border-radius:12px;margin-bottom:12px;outline:none}
input:focus{border-color:#facc15}
button{width:100%;background:#facc15;color:#000;font-weight:800;padding:14px;border:none;border-radius:12px;cursor:pointer;margin-top:8px;letter-spacing:1px}
button:hover{background:#eab308}
#err{color:#ff4d4d;font-size:12px;margin-top:14px;display:none;background:#2a1515;padding:8px;border-radius:8px}
.foot{color:#444;font-size:10px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<h1>OZZIEKOST</h1>
<div class="sub">Secure Integrated System</div>
<input id="user" placeholder="Username atau Email" value="manager@ozziekost.web.id" autocomplete="username">
<input id="pass" type="password" placeholder="Password" value="" autocomplete="current-password">
<button id="loginBtn">LOGIN</button>
<div id="err"></div>
<div class="foot">Login pakai akun Firebase - Hubungi manager</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC3thAoOe8k0Xf5gcqrYauXbPoTw_PzWp4",
  authDomain: "ozziekost-9aa45.firebaseapp.com",
  projectId: "ozziekost-9aa45",
  storageBucket: "ozziekost-9aa45.firebasestorage.app",
  messagingSenderId: "77001631676",
  appId: "1:77001631676:web:7b2b1e51ffa87adf4dd3b9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const login = async () => {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  const errBox = document.getElementById('err');
  const btn = document.getElementById('loginBtn');
  errBox.style.display='none';
  errBox.textContent='';

  if(!u ||!p){
    errBox.textContent="Isi username & password dulu mbah";
    errBox.style.display='block';
    return;
  }

  btn.textContent = "PROSES...";
  btn.disabled = true;

  // Daftar email yang akan dicoba
  let emailsToTry = [];
  if(u.includes("@")){
    emailsToTry = [u];
  } else {
    emailsToTry = [
      `${u}@ozziekost.web.id`,
      `${u}@ozziekost-9aa45.firebaseapp.com`,
      `${u}@ozziekost-9a445.firebaseapp.com`
    ];
  }

  let lastError = null;
  for(let email of emailsToTry){
    try{
      console.log("Mencoba login:", email);
      const cred = await signInWithEmailAndPassword(auth, email, p);
      localStorage.setItem("ozzie_session", JSON.stringify({user: u, email: email, uid: cred.user.uid, time: Date.now()}));
      window.location.href = "dashboard.html";
      return;
    }catch(e){
      lastError = e;
      console.log("Gagal:", email, e.code);
      // kalau salah password, jangan coba email lain
      if(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential'){
         continue;
      }
    }
  }

  // Gagal semua
  let msg = "Login gagal: " + (lastError? lastError.code : "unknown");
  if(lastError && lastError.code === 'auth/invalid-credential'){
    msg = "Password salah atau user belum ada di project ozziekost-9aa45. Bikin user manager@ozziekost.web.id di Firebase > Authentication > Add user";
  }
  errBox.textContent = msg;
  errBox.style.display='block';
  btn.textContent = "LOGIN";
  btn.disabled = false;
};

document.getElementById('loginBtn').addEventListener('click', login);
document.addEventListener('keydown', (e)=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
