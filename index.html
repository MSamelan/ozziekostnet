<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Admin - OZZIEKOST</title>
<!-- TAMBAHIN INI BUAT GRAFIK -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body { font-family: Arial; background: #f4f6f9; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { color: #007bff; }
    .btn-logout { background: #dc3545; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
    
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h3 { margin: 0; color: #555; font-size: 14px; }
    .card p { font-size: 24px; font-weight: bold; margin: 10px 0 0 0; }

    /* CARD GRAFIK BARU */
    .chart-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }

    .table-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
    .status-lunas { color: green; font-weight: bold; }
    .status-belum { color: red; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
    <h1>Dashboard Admin OZZIEKOST</h1>
    <a href="login.html" class="btn-logout">Logout</a>
</div>

<!-- 3 KARTU STATISTIK -->
<div class="stats">
    <div class="card">
        <h3>Pemasukan Bulan Ini</h3>
        <p>Rp 24.000.000</p>
    </div>
    <div class="card">
        <h3>Pemasukan YTD</h3>
        <p>Rp 180.000.000</p>
    </div>
    <div class="card">
        <h3>Jatuh Tempo</h3>
        <p>5 Penghuni</p>
    </div>
</div>

<!-- CARD GRAFIK BARU -->
<div class="chart-card">
    <h3>Grafik Pemasukan 6 Bulan Terakhir</h3>
    <canvas id="grafikPemasukan"></canvas>
</div>

<!-- TABEL PENGHUNI -->
<div class="table-box">
    <h3>Data Penghuni</h3>
    <table>
        <tr><th>Nama</th><th>Kamar</th><th>Status</th></tr>
        <tr><td>Budi</td><td>A1</td><td class="status-lunas">Lunas</td></tr>
        <tr><td>Ani</td><td>B2</td><td class="status-belum">Belum</td></tr>
    </table>
</div>

<!-- SCRIPT GRAFIK -->
<script>
const ctx = document.getElementById('grafikPemasukan');

new Chart(ctx, {
    type: 'bar', // bisa ganti 'line' kalau mau grafik garis
    data: {
        labels: ['Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus'],
        datasets: [{
            label: 'Pemasukan Rp',
            data: [22000000, 24000000, 21000000, 25000000, 23000000, 24000000],
            backgroundColor: '#007bff',
            borderRadius: 8
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { display: false }
        },
        scales: {
            y: {
                ticks: {
                    callback: function(value) {
                        return 'Rp ' + value.toLocaleString('id-ID');
                    }
                }
            }
        }
    }
});
</script>

</body>
</html>
