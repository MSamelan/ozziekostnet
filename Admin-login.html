<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin OZZIEKOST</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #007bff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0;
    }
    .login-box { 
      background: white; 
      padding: 40px; 
      border-radius: 15px; 
      box-shadow: 0 5px 20px rgba(0,0,0,0.2); 
      width: 350px; 
      text-align: center;
    }
    .login-box h2 { 
      color: #007bff; 
      margin-bottom: 10px;
    }
    .login-box p { 
      color: #666; 
      margin-bottom: 25px; 
      font-size: 14px;
    }
    .login-box input { 
      width: 100%; 
      padding: 12px; 
      margin: 10px 0; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      box-sizing: border-box;
      font-size: 15px;
    }
    .login-box button { 
      width: 100%; 
      padding: 12px; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 10px;
    }
    .login-box button:hover { 
      background: #0056b3; 
    }
    .back-home {
      margin-top: 20px;
      font-size: 14px;
    }
    .back-home a {
      color: #007bff;
      text-decoration: none;
    }
    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login Admin</h2>
    <p>Khusus Admin OZZIEKOST</p>
    
    <input type="text" id="username" placeholder="Username Admin">
    <input type="password" id="password" placeholder="Password Admin">
    <button onclick="loginAdmin()">Masuk</button>
    
    <div class="error" id="errorMsg">Username atau Password Salah!</div>
    
    <div class="back-home">
      <a href="index.html">← Kembali ke Home</a>
    </div>
  </div>

<script>
function loginAdmin(){
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    // GANTI USERNAME & PASSWORD ADMIN DI SINI
    if(user === "admin" && pass === "admin123"){
        localStorage.setItem('userLogin', 'admin'); // KUNCI BUAT MASUK admin.html
        window.location.href = "admin.html";
    } else {
        errorMsg.style.display = "block";
    }
}

// Enter buat login
document.addEventListener('keypress', function(e){
    if(e.key === 'Enter'){
        loginAdmin();
    }
});
</script>
</body>
</html>
